<svg xmlns="http://www.w3.org/2000/svg" width="960" height="522" viewBox="0 0 960 522" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">How to measure whether your BI is working</title>
<desc id="d">Example. Dashboard usage (times opened per week): 0, 3, 5, Higher is better; Decisions made with it (per month): 0, 1, 3, Higher is better; Monthly report (hours to prepare it): 10, 4, 2, Lower is better; Collections (average days to collect): 52, 45, 38, Lower is better; Stockouts (key products, per month): 6, 4, 2, Lower is better.</desc>
<rect width="960" height="522" rx="24" fill="#16141d"/>
<text x="40" y="58" font-size="26" fill="#f5f5f7" font-weight="700">How to measure whether your BI is working</text>
