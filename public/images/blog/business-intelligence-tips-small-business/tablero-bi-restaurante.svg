<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tablero semanal de un restaurante</title>
<desc id="d">VENTAS: US$14.000 (por semana). TICKET PROMEDIO: US$25 (por cuenta). COSTO DE COMIDA: 35% (meta: 30%). COSTO DE PERSONAL: 30% (de las ventas). VENTAS POR DÍA (US$): Lun 1.200, Mar 1.100, Mié 1.600, Jue 1.900, Vie 3.200, Sáb 3.400, Dom 1.600. PLATOS: Parrillada mixta, 140, 48%, Revisar porción; Hamburguesa, 180, 31%, Mantener; Pasta del día, 60, 22%, Promover; Ensalada César, 35, 40%, Revisar o sacar. Valores de ejemplo, no datos reales.</desc>
