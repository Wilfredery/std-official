<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">How an AI automation works</title>
<desc id="d">A new web form triggers the workflow, an AI step classifies the lead, and three actions run: create the CRM contact, add a row to a sheet and notify the salesperson.</desc>
<rect width="960" height="420" rx="24" fill="#16141d"/>
<text x="40" y="58" font-size="26" fill="#f5f5f7" font-weight="700" text-anchor="start">How an AI automation works</text>
<text x="40" y="112" font-size="13" fill="#c4b5fd" font-weight="600" text-anchor="start" letter-spacing="1.5">TRIGGER</text>
<rect x="40" y="128" width="240" height="150" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<g transform="translate(64 152) scale(1.4166666666666667)" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></g>
<text x="64" y="222" font-size="17" fill="#f5f5f7" font-weight="600" text-anchor="start">New web form</text>
<text x="64" y="246" font-size="15" fill="#a1a1b5" font-weight="400" text-anchor="start">A lead fills it out</text>
<path d="M288 203 L342 203" stroke="#8b5cf6" stroke-width="2.5" fill="none"/><path d="M333 197 L342 203 L333 209" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="112" font-size="13" fill="#c4b5fd" font-weight="600" text-anchor="start" letter-spacing="1.5">AI STEP</text>
<rect x="350" y="128" width="240" height="150" rx="14" fill="#211e2c" stroke="#8b5cf6" stroke-width="1.5"/>
<g transform="translate(374 152) scale(1.4166666666666667)" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></g>
<text x="374" y="222" font-size="17" fill="#f5f5f7" font-weight="600" text-anchor="start">Classify the lead</text>
<text x="374" y="246" font-size="15" fill="#a1a1b5" font-weight="400" text-anchor="start">Sales or support?</text>
<text x="660" y="112" font-size="13" fill="#c4b5fd" font-weight="600" text-anchor="start" letter-spacing="1.5">ACTIONS</text>
<path d="M590 203 H622 M622 161 V325" stroke="#8b5cf6" stroke-width="2.5" fill="none"/>
<path d="M622 161 L652 161" stroke="#8b5cf6" stroke-width="2.5" fill="none"/><path d="M643 155 L652 161 L643 167" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="128" width="270" height="66" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<g transform="translate(680 147) scale(1.1666666666666667)" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></g>
<text x="722" y="167" font-size="16" fill="#f5f5f7" font-weight="500" text-anchor="start">Create CRM contact</text>
<path d="M622 243 L652 243" stroke="#8b5cf6" stroke-width="2.5" fill="none"/><path d="M643 237 L652 243 L643 249" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="210" width="270" height="66" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<g transform="translate(680 229) scale(1.1666666666666667)" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></g>
<text x="722" y="249" font-size="16" fill="#f5f5f7" font-weight="500" text-anchor="start">Add row to sheet</text>
<path d="M622 325 L652 325" stroke="#8b5cf6" stroke-width="2.5" fill="none"/><path d="M643 319 L652 325 L643 331" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="292" width="270" height="66" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<g transform="translate(680 311) scale(1.1666666666666667)" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></g>
<text x="722" y="331" font-size="16" fill="#f5f5f7" font-weight="500" text-anchor="start">Notify salesperson</text>
<text x="40" y="388" font-size="15" fill="#a1a1b5" font-weight="400" text-anchor="start">AI does the reading. The workflow does the moving.</text>
</svg>
