<text x="266" y="383.0" font-size="14" fill="#d4d4dc" font-weight="400">¿Cuánta agua</text>
<text x="266" y="403.0" font-size="14" fill="#d4d4dc" font-weight="400">nunca cobramos?</text>
<text x="486" y="383.0" font-size="14" fill="#d4d4dc" font-weight="400">Medidores de</text>
<text x="486" y="403.0" font-size="14" fill="#d4d4dc" font-weight="400">producción y facturación</text>
<text x="706" y="383.0" font-size="15" fill="#c4b5fd" font-weight="600">Agua no facturada:</text>
<text x="706" y="403.0" font-size="15" fill="#c4b5fd" font-weight="600">de 18% a 13%</text>
<line x1="56" y1="424" x2="904" y2="424" stroke="#363149" stroke-width="1" stroke-opacity="0.6"/>
<text x="56" y="465.0" font-size="15" fill="#f5f5f7" font-weight="600">Horas extra</text>
<text x="266" y="455.0" font-size="14" fill="#d4d4dc" font-weight="400">¿A dónde se van</text>
<text x="266" y="475.0" font-size="14" fill="#d4d4dc" font-weight="400">las horas extra?</text>
<text x="486" y="455.0" font-size="14" fill="#d4d4dc" font-weight="400">Nómina y</text>
