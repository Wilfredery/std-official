<text x="266" y="167.0" font-size="14" fill="#d4d4dc" font-weight="400">¿Dónde se atascan</text>
<text x="266" y="187.0" font-size="14" fill="#d4d4dc" font-weight="400">las solicitudes?</text>
<text x="486" y="167.0" font-size="14" fill="#d4d4dc" font-weight="400">Sistema de</text>
<text x="486" y="187.0" font-size="14" fill="#d4d4dc" font-weight="400">permisos</text>
<text x="706" y="167.0" font-size="15" fill="#c4b5fd" font-weight="600">Días para emitir:</text>
<text x="706" y="187.0" font-size="15" fill="#c4b5fd" font-weight="600">de 34 a 19</text>
<line x1="56" y1="208" x2="904" y2="208" stroke="#363149" stroke-width="1" stroke-opacity="0.6"/>
<text x="56" y="249.0" font-size="15" fill="#f5f5f7" font-weight="600">Solicitudes 311</text>
<text x="266" y="239.0" font-size="14" fill="#d4d4dc" font-weight="400">¿Qué vecindarios</text>
<text x="266" y="259.0" font-size="14" fill="#d4d4dc" font-weight="400">esperan más?</text>
<text x="486" y="239.0" font-size="14" fill="#d4d4dc" font-weight="400">311 y órdenes</text>
<text x="486" y="259.0" font-size="14" fill="#d4d4dc" font-weight="400">de trabajo</text>
