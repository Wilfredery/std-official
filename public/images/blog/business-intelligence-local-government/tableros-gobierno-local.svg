<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">5 tableros para una ciudad pequeña</title>
<desc id="d">Permisos e inspecciones: ¿Dónde se atascan las solicitudes? Datos que usa: Sistema de permisos. Resultado en el ejemplo: Días para emitir: de 34 a 19. Solicitudes 311: ¿Qué vecindarios esperan más? Datos que usa: 311 y órdenes de trabajo. Resultado en el ejemplo: Tiempo para cerrar: de 9 a 4 días. Presupuesto vs. gasto real: ¿Cada departamento va en presupuesto? Datos que usa: Sistema financiero. Resultado en el ejemplo: Informe al concejo: de 30 a 4 horas. Facturación de agua: ¿Cuánta agua nunca cobramos? Datos que usa: Medidores de producción y facturación. Resultado en el ejemplo: Agua no facturada: de 18% a 13%. Horas extra: ¿A dónde se van las horas extra? Datos que usa: Nómina y calendarios. Resultado en el ejemplo: Horas extra en obras públicas: -12%. Ciudad ilustrativa de 18,000 habitantes y 140 empleados. Resultados a los 6 a 12 meses.</desc>
<rect width="960" height="570" rx="24" fill="#16141d"/>
