<text x="706" y="455.0" font-size="15" fill="#c4b5fd" font-weight="600">Horas extra en obras</text>
<text x="706" y="475.0" font-size="15" fill="#c4b5fd" font-weight="600">públicas: -12%</text>
<text x="40" y="542" font-size="13" fill="#a1a1b5">Ciudad ilustrativa de 18,000 habitantes y 140 empleados. Resultados a los 6 a 12 meses.</text>
