<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">5 dashboards for a small city</title>
<desc id="d">Permits and inspections: Where do applications get stuck? Data it uses: Permitting system. Result in the example: Days to issue: from 34 to 19. 311 requests: Which neighborhoods wait the longest? Data it uses: 311 and work orders. Result in the example: Time to close: from 9 to 4 days. Budget vs. actual: Is each department on budget? Data it uses: Financial system. Result in the example: Council report: from 30 to 4 hours. Water billing: How much water do we never bill? Data it uses: Production meters and billing. Result in the example: Unbilled water: from 18% to 13%. Overtime: Where do the extra hours go? Data it uses: Payroll and schedules. Result in the example: Public works overtime: -12%. Illustrative city of 18,000 residents and 140 employees. Results after 6 to 12 months.</desc>
<rect width="960" height="570" rx="24" fill="#16141d"/>
<text x="40" y="58" font-size="26" fill="#f5f5f7" font-weight="700">5 dashboards for a small city</text>
<rect x="840.4" y="36" width="79.6" height="28" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<text x="880.2" y="55" font-size="12" fill="#a1a1b5" font-weight="700" letter-spacing="1" text-anchor="middle">EXAMPLE</text>
<rect x="40" y="88" width="880" height="416" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<rect x="690" y="96" width="222" height="400" rx="10" fill="#8b5cf6" fill-opacity="0.14"/>
<text x="56" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">DASHBOARD</text>
<text x="266" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">QUESTION IT ANSWERS</text>
<text x="486" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">DATA IT USES</text>
<text x="706" y="118" font-size="12" fill="#c4b5fd" font-weight="600" letter-spacing="0.5">RESULT IN THE EXAMPLE</text>
<line x1="40" y1="136" x2="920" y2="136" stroke="#363149" stroke-width="1"/>
<text x="56" y="167.0" font-size="15" fill="#f5f5f7" font-weight="600">Permits and</text>
<text x="56" y="187.0" font-size="15" fill="#f5f5f7" font-weight="600">inspections</text>
<text x="266" y="167.0" font-size="14" fill="#d4d4dc" font-weight="400">Where do applications</text>
<text x="266" y="187.0" font-size="14" fill="#d4d4dc" font-weight="400">get stuck?</text>
<text x="486" y="167.0" font-size="14" fill="#d4d4dc" font-weight="400">Permitting</text>
<text x="486" y="187.0" font-size="14" fill="#d4d4dc" font-weight="400">system</text>
<text x="706" y="167.0" font-size="15" fill="#c4b5fd" font-weight="600">Days to issue:</text>
<text x="706" y="187.0" font-size="15" fill="#c4b5fd" font-weight="600">from 34 to 19</text>
<line x1="56" y1="208" x2="904" y2="208" stroke="#363149" stroke-width="1" stroke-opacity="0.6"/>
<text x="56" y="249.0" font-size="15" fill="#f5f5f7" font-weight="600">311 requests</text>
<text x="266" y="239.0" font-size="14" fill="#d4d4dc" font-weight="400">Which neighborhoods</text>
<text x="266" y="259.0" font-size="14" fill="#d4d4dc" font-weight="400">wait the longest?</text>
<text x="486" y="239.0" font-size="14" fill="#d4d4dc" font-weight="400">311 and</text>
<text x="486" y="259.0" font-size="14" fill="#d4d4dc" font-weight="400">work orders</text>
<text x="706" y="239.0" font-size="15" fill="#c4b5fd" font-weight="600">Time to close:</text>
<text x="706" y="259.0" font-size="15" fill="#c4b5fd" font-weight="600">from 9 to 4 days</text>
<line x1="56" y1="280" x2="904" y2="280" stroke="#363149" stroke-width="1" stroke-opacity="0.6"/>
<text x="56" y="321.0" font-size="15" fill="#f5f5f7" font-weight="600">Budget vs. actual</text>
<text x="266" y="311.0" font-size="14" fill="#d4d4dc" font-weight="400">Is each department</text>
<text x="266" y="331.0" font-size="14" fill="#d4d4dc" font-weight="400">on budget?</text>
<text x="486" y="311.0" font-size="14" fill="#d4d4dc" font-weight="400">Financial</text>
<text x="486" y="331.0" font-size="14" fill="#d4d4dc" font-weight="400">system</text>
<text x="706" y="311.0" font-size="15" fill="#c4b5fd" font-weight="600">Council report:</text>
<text x="706" y="331.0" font-size="15" fill="#c4b5fd" font-weight="600">from 30 to 4 hours</text>
<line x1="56" y1="352" x2="904" y2="352" stroke="#363149" stroke-width="1" stroke-opacity="0.6"/>
<text x="56" y="393.0" font-size="15" fill="#f5f5f7" font-weight="600">Water billing</text>
<text x="266" y="383.0" font-size="14" fill="#d4d4dc" font-weight="400">How much water do</text>
<text x="266" y="403.0" font-size="14" fill="#d4d4dc" font-weight="400">we never bill?</text>
<text x="486" y="383.0" font-size="14" fill="#d4d4dc" font-weight="400">Production meters</text>
<text x="486" y="403.0" font-size="14" fill="#d4d4dc" font-weight="400">and billing</text>
<text x="706" y="383.0" font-size="15" fill="#c4b5fd" font-weight="600">Unbilled water:</text>
<text x="706" y="403.0" font-size="15" fill="#c4b5fd" font-weight="600">from 18% to 13%</text>
<line x1="56" y1="424" x2="904" y2="424" stroke="#363149" stroke-width="1" stroke-opacity="0.6"/>
<text x="56" y="465.0" font-size="15" fill="#f5f5f7" font-weight="600">Overtime</text>
<text x="266" y="455.0" font-size="14" fill="#d4d4dc" font-weight="400">Where do the extra</text>
<text x="266" y="475.0" font-size="14" fill="#d4d4dc" font-weight="400">hours go?</text>
<text x="486" y="455.0" font-size="14" fill="#d4d4dc" font-weight="400">Payroll and</text>
<text x="486" y="475.0" font-size="14" fill="#d4d4dc" font-weight="400">schedules</text>
<text x="706" y="455.0" font-size="15" fill="#c4b5fd" font-weight="600">Public works</text>
<text x="706" y="475.0" font-size="15" fill="#c4b5fd" font-weight="600">overtime: -12%</text>
<text x="40" y="542" font-size="13" fill="#a1a1b5">Illustrative city of 18,000 residents and 140 employees. Results after 6 to 12 months.</text>
</svg>
