<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Data governance matrix</title>
<desc id="d">Customers: Owner Office admin, Official source Invoicing system, Who edits Office admin, Who views Everyone, Review Monthly. Prices: Owner Sales manager, Official source Invoicing system, Who edits Sales manager, Who views Sales &amp; management, Review Weekly. Inventory: Owner Warehouse lead, Official source Warehouse sheet, Who edits Warehouse, Who views Sales &amp; purchasing, Review Weekly. Invoices &amp; payments: Owner Accounting, Official source Invoicing system, Who edits Accounting, Who views Management, Review Monthly. Orders: Owner Sales manager, Official source System (not WhatsApp), Who edits Sales reps, Who views Sales &amp; warehouse, Review Daily. Example 25-person distributor. One owner per data set and a single official source.</desc>
<rect width="960" height="520" rx="24" fill="#16141d"/>
<text x="40" y="58" font-size="26" fill="#f5f5f7" font-weight="700">Data governance matrix</text>
<rect x="839" y="36" width="81" height="28" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<text x="879.5" y="55" font-size="12" fill="#a1a1b5" font-weight="700" letter-spacing="1" text-anchor="middle">EXAMPLE</text>
<rect x="40" y="88" width="880" height="368" rx="14" fill="#211e2c" stroke="#363149" stroke-width="1.5"/>
<rect x="210" y="96" width="150" height="352" rx="10" fill="#8b5cf6" fill-opacity="0.14"/>
<text x="56" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">DATA</text>
