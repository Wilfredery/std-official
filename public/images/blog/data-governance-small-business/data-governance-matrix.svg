<text x="846" y="173.0" font-size="13" fill="#d4d4dc" font-weight="400">Monthly</text>
<line x1="56" y1="200" x2="904" y2="200" stroke="#363149" stroke-width="1" stroke-opacity="0.6"/>
<text x="56" y="237.0" font-size="15" fill="#f5f5f7" font-weight="600">Prices</text>
