<text x="376" y="237.0" font-size="13" fill="#d4d4dc" font-weight="400">Invoicing system</text>
<text x="556" y="237.0" font-size="13" fill="#d4d4dc" font-weight="400">Sales manager</text>
<text x="696" y="237.0" font-size="13" fill="#d4d4dc" font-weight="400">Sales &amp; management</text>
