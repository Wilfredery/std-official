<text x="376" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">OFFICIAL SOURCE</text>
<text x="556" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">WHO EDITS</text>
<text x="696" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">WHO VIEWS</text>
<text x="846" y="118" font-size="12" fill="#a1a1b5" font-weight="600" letter-spacing="0.5">REVIEW</text>
<line x1="40" y1="136" x2="920" y2="136" stroke="#363149" stroke-width="1"/>
