<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Matriz de gobernanza de datos</title>
<desc id="d">Clientes: Dueño Administración, Fuente oficial Sistema de facturación, Quién edita Administración, Quién ve Todos, Revisión Mensual. Precios: Dueño Gerente comercial, Fuente oficial Sistema de facturación, Quién edita Gerente comercial, Quién ve Ventas y gerencia, Revisión Semanal. Inventario: Dueño Jefe de almacén, Fuente oficial Hoja de almacén, Quién edita Almacén, Quién ve Ventas y compras, Revisión Semanal. Facturas y cobros: Dueño Contabilidad, Fuente oficial Sistema de facturación, Quién edita Contabilidad, Quién ve Gerencia, Revisión Mensual. Pedidos: Dueño Gerente comercial, Fuente oficial Sistema (no WhatsApp), Quién edita Vendedores, Quién ve Ventas y almacén, Revisión Diaria. Distribuidora de ejemplo, 25 empleados. Un dueño por dato y una sola fuente oficial.</desc>
